plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = rootProject.java_version as int
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

def forbiddenApiReferences = [
        'net.minecraft.',
        'com.mojang.',
        'net.fabricmc.',
        'top.ceroxe.mcvulkanrt.renderer.rt.',
        'top.ceroxe.mcvulkanrt.renderer.scene.',
        'OpenGL',
        'OpenGl',
        'opengl'
].asImmutable()

def apiProductionSources = fileTree('src/main') {
    include '**/*.java'
}

tasks.register('verifyRendererApiBoundary') {
    group = 'verification'
    description = 'Rejects source-engine and renderer implementation dependencies in renderer-api.'
    inputs.files(apiProductionSources)

    doLast {
        def violations = []
        apiProductionSources.files.sort().each { file ->
            file.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenApiReferences.each { forbidden ->
                    if (line.contains(forbidden)) {
                        def relative = projectDir.toPath().relativize(file.toPath())
                        violations << "${relative}:${index + 1}: ${forbidden}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "renderer-api must remain host and implementation independent:\n" + violations.join('\n')
            )
        }
    }
}

tasks.register('rendererApiContractSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verifies immutable scene, frame, provider, and GPU-frame ownership contracts.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ceroxe.mcvulkanrt.renderer.api.RendererApiContractSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('rendererApiContractSelfTest')
    dependsOn tasks.named('verifyRendererApiBoundary')
}
