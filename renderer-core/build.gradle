plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

dependencies {
    api project(':renderer-api')
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    api 'org.joml:joml:1.10.8'
    api 'org.lwjgl:lwjgl:3.4.1'
    api 'org.lwjgl:lwjgl-vulkan:3.4.1'
    api 'org.lwjgl:lwjgl-vma:3.4.1'
    implementation 'org.lwjgl:lwjgl-shaderc:3.4.1'

    // renderer-core is published as a ready-to-run Windows backend. Keeping natives test-only
    // makes the published provider discoverable but impossible to initialize in a clean host.
    runtimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-vma:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc:3.4.1:natives-windows'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = rootProject.java_version as int
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

/*
 * Core contracts are deterministic JavaExec programs registered below, not JUnit tests. Gradle 9.5
 * otherwise treats the intentionally empty JUnit discovery result as a configuration failure before
 * those real gates can run.
 */
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED',
            '--sun-misc-unsafe-memory-access=allow',
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '-Duser.language=en',
            '-Duser.country=US'
    systemProperties(System.getProperties().findAll { key, ignored ->
        key.toString().startsWith('mcvulkanrt.')
    })
}

/*
 * Match dependency namespaces instead of prose words such as "Minecraft".
 * Renderer documentation must be able to explain the host boundary without
 * turning a comment into a false-positive dependency violation.
 */
def forbiddenCoreReferences = [
        'net.minecraft.',
        'com.mojang.',
        'net.fabricmc.',
        'org.lwjgl.opengl.',
        'top.ceroxe.mcvulkanrt.MCVulkanRT',
        'top.ceroxe.mcvulkanrt.bridge.',
        'top.ceroxe.mcvulkanrt.mixin.'
].asImmutable()

def coreProductionSources = fileTree('src/main') {
    include '**/*.java'
    include '**/*.rgen'
    include '**/*.rmiss'
    include '**/*.rchit'
}

tasks.register('verifyNoMinecraftDependencies') {
    group = 'verification'
    description = 'Rejects host-game, Mojang, Fabric, bridge, mixin, and OpenGL dependencies in renderer-core production code.'
    inputs.files(coreProductionSources)

    doLast {
        def violations = []
        coreProductionSources.files.sort().each { file ->
            file.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenCoreReferences.each { forbidden ->
                    if (line.contains(forbidden)) {
                        def relative = projectDir.toPath().relativize(file.toPath())
                        violations << "${relative}:${index + 1}: ${forbidden}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "renderer-core must remain Minecraft-independent:\n" + violations.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoMinecraftDependencies')
}

def registerCoreSelfTest = { String taskName, String mainClassName, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
    }
}

