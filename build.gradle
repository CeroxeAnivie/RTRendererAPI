plugins {
    id 'base'
}

group = providers.gradleProperty('project_group').get()
version = providers.gradleProperty('project_version').get()

subprojects {
    group = rootProject.group
    version = rootProject.version

    apply plugin: 'maven-publish'

    dependencyLocking {
        lockAllConfigurations()
    }

    plugins.withId('java-library') {
        tasks.named('jar', Jar) {
            from(rootProject.file('LICENSE')) {
                into 'META-INF'
            }
        }

        publishing {
            publications {
                create('mavenJava', MavenPublication) {
                    from components.java
                    artifactId = project.name

                    pom {
                        name = project.name == 'renderer-api'
                                ? 'RTRendererAPI Contracts'
                                : 'RTRendererAPI Vulkan Backend'
                        description = project.name == 'renderer-api'
                                ? 'Host-independent ray tracing renderer contracts.'
                                : 'Vulkan ray tracing renderer implementation.'
                        url = 'https://github.com/CeroxeAnivie/RTRendererAPI'

                        licenses {
                            license {
                                name = 'MIT License'
                                url = 'https://opensource.org/licenses/MIT'
                                distribution = 'repo'
                            }
                        }

                        developers {
                            developer {
                                id = 'CeroxeAnivie'
                                name = 'Ceroxe'
                                email = '1591117599@qq.com'
                                organization = 'Ceroxe'
                                url = 'https://github.com/CeroxeAnivie'
                            }
                        }

                        scm {
                            connection = 'scm:git:git://github.com/CeroxeAnivie/RTRendererAPI.git'
                            developerConnection = 'scm:git:ssh://github.com/CeroxeAnivie/RTRendererAPI.git'
                            url = 'https://github.com/CeroxeAnivie/RTRendererAPI'
                        }
                    }
                }
            }

            repositories {
                maven {
                    name = 'localStaging'
                    url = rootProject.layout.buildDirectory.dir('repository')
                }
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn ':renderer-api:assemble', ':renderer-core:assemble'
}

tasks.named('check') {
    dependsOn ':renderer-api:check', ':renderer-core:check'
}

tasks.register('publishAllToLocalStagingRepository') {
    group = 'publishing'
    description = 'Publishes every RTRendererAPI module into build/repository.'
    dependsOn ':renderer-api:publishMavenJavaPublicationToLocalStagingRepository'
    dependsOn ':renderer-core:publishMavenJavaPublicationToLocalStagingRepository'
}
