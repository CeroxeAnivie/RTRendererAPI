name: native-rtx

on:
  # Mainline and version tags are trusted repository refs. Merge queues provide the pre-merge
  # hardware gate without executing arbitrary fork PRs directly on the self-hosted RTX runner.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rtx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vulkan-rt-hardware-gate:
    # The custom label prevents this correctness/performance lane from ever falling back to a
    # hosted runner without a hardware ray-tracing device.
    runs-on: [ self-hosted, Windows, X64, rtrenderer-rtx ]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          validate-wrappers: true
      - name: Run strict release acceptance
        shell: pwsh
        run: >-
          .\gradlew.bat strictAcceptanceTest
          --dependency-verification=strict --no-daemon --console=plain --stacktrace
      - name: Upload native diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-rtx-diagnostics-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 14
