name: native-rtx

on:
  # Mainline and version tags are trusted repository refs. Merge queues provide the pre-merge
  # hardware gate without executing arbitrary fork PRs directly on the self-hosted RTX runner.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rtx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vulkan-rt-hardware-gate:
    # The custom label prevents this correctness/performance lane from ever falling back to a
    # hosted runner without a hardware ray-tracing device.
    runs-on: [ self-hosted, Windows, X64, rtrenderer-rtx ]
    timeout-minutes: 120
    env:
      RTRENDERER_CMAKE_EXECUTABLE: ${{ vars.RTRENDERER_CMAKE_EXECUTABLE }}
      RTRENDERER_NRD_SDK_ROOT: ${{ vars.RTRENDERER_NRD_SDK_ROOT }}
      RTRENDERER_NRI_SDK_ROOT: ${{ vars.RTRENDERER_NRI_SDK_ROOT }}
      RTRENDERER_STREAMLINE_SDK_ROOT: ${{ vars.RTRENDERER_STREAMLINE_SDK_ROOT }}
      RTRENDERER_RTXMU_SDK_ROOT: ${{ vars.RTRENDERER_RTXMU_SDK_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: graalvm
          java-version: '25'
          cache: gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          validate-wrappers: true
      - name: Validate fixed NVIDIA SDK inputs
        shell: pwsh
        run: |
          $required = @(
            'RTRENDERER_CMAKE_EXECUTABLE',
            'RTRENDERER_NRD_SDK_ROOT',
            'RTRENDERER_NRI_SDK_ROOT',
            'RTRENDERER_STREAMLINE_SDK_ROOT',
            'RTRENDERER_RTXMU_SDK_ROOT'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -ne 0) { throw "Missing native-rtx repository variables: $($missing -join ', ')" }
          if (-not (Test-Path -LiteralPath $env:RTRENDERER_CMAKE_EXECUTABLE -PathType Leaf)) {
            throw "CMake executable does not exist: $env:RTRENDERER_CMAKE_EXECUTABLE"
          }
      - name: Run strict release acceptance
        shell: pwsh
        run: |
          .\gradlew.bat strictAcceptanceTest `
            -PcmakeExecutable="$env:RTRENDERER_CMAKE_EXECUTABLE" `
            -PnrdSdkRoot="$env:RTRENDERER_NRD_SDK_ROOT" `
            -PnriSdkRoot="$env:RTRENDERER_NRI_SDK_ROOT" `
            -PstreamlineSdkRoot="$env:RTRENDERER_STREAMLINE_SDK_ROOT" `
            -PrtxmuSdkRoot="$env:RTRENDERER_RTXMU_SDK_ROOT" `
            -PjdkHome="$env:JAVA_HOME" `
            --dependency-verification=strict --no-daemon --console=plain --stacktrace
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-rtx-diagnostics-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/hs_err_pid*.log
          if-no-files-found: error
          retention-days: 14
