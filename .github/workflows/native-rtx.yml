name: native-rtx

on:
  # Mainline and version tags are trusted repository refs. Merge queues provide the pre-merge
  # hardware gate without executing arbitrary fork PRs directly on the self-hosted RTX runner.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rtx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rtxpt-hardware-gate:
    # The custom label prevents this correctness/performance lane from ever falling back to a
    # hosted runner without a hardware ray-tracing device.
    runs-on: [ self-hosted, Windows, X64, rtrenderer-rtx ]
    timeout-minutes: 120
    env:
      RTRENDERER_CMAKE_EXECUTABLE: ${{ vars.RTRENDERER_CMAKE_EXECUTABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: graalvm
          java-version: '25'
          cache: gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          validate-wrappers: true
      - name: Verify native bridge, runtime and contracts
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:RTRENDERER_CMAKE_EXECUTABLE -PathType Leaf)) { throw "Missing CMake executable" }
          ./tools/Invoke-BoundedBuild.ps1 -FilePath "$env:JAVA_HOME/bin/java.exe" -ArgumentList @(
            '-cp','gradle/wrapper/gradle-wrapper.jar','org.gradle.wrapper.GradleWrapperMain',
            'assemble','check',':renderer-rtxpt:rtxptReleaseValidationClasspath',
            "-PcmakeExecutable=$env:RTRENDERER_CMAKE_EXECUTABLE",
            '--dependency-verification=strict','--no-daemon','--no-parallel','--max-workers=1','--console=plain'
          ) -TimeoutSeconds 5400
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify native rendering contracts serially
        shell: pwsh
        run: |
          $tests=@('RtxptBridgeMigrationNativeSelfTest','RtxptMeshInputBatchingNativeSelfTest',
            'RtxptMeshInputLifetimeNativeSelfTest','RtxptBlasCapacityNativeSelfTest',
            'RtxptBeautyMaskedEntryNativeSelfTest','RtxptSignalQueriesNativeSelfTest',
            'RtxptMaterialMutationNativeSelfTest','RtxptEnvironmentMapNativeSelfTest',
            'RtxptAnalyticLightsNativeSelfTest','RtxptBridgeTopologyNativeSelfTest',
            'RtxptDirectMaterialLifecycleNativeSelfTest')
          foreach ($name in $tests) {
            ./tools/Invoke-RtxptHost.ps1 -MainClass ("top.ceroxe.rt.renderer.rtxpt."+$name) -ApplicationArguments ("build/reports/native-contracts/"+$name)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rtx-diagnostics-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/hs_err_pid*.log
          if-no-files-found: error
          retention-days: 14
