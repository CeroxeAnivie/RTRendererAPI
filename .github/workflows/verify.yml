name: verify

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contracts:
    name: deterministic-contracts-java-${{ matrix.java }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Java ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          validate-wrappers: true
      - name: Verify deterministic contracts and Java artifacts
        shell: pwsh
        run: .\gradlew.bat clean :check :renderer-api:assemble :renderer-rtxpt:javadoc :renderer-rtxpt:sourcesJar -Pjava_toolchain_version=${{ matrix.java }} --dependency-verification=strict --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

