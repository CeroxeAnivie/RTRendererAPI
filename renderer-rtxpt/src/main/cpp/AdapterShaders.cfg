// External adapter only. The official Rtxpt/shaders.cfg and targets stay untouched.
// -o preserves the existing external ShaderFactory request names without copying sources.
// These permutations are the actual requests in rtxpt_native_lighting.h and rtxpt_native_rr.h.
RtrNativeLighting.hlsl -T cs -E main -o app/ProcessingPasses -D RTR_LIGHT_GROUP_CAPACITY={1,2,4,32} -D RTR_ANALYTIC_LIGHTS={0,1} -D RTR_WORK_STATISTICS={0,1} -D RTR_MAX_COMPOSITION={0,1,2}
RtrNativeLightingReconstruct.hlsl -T cs -E main -o app/ProcessingPasses -D RTR_LIGHT_GROUP_CAPACITY={1,2,4,32} -D RTR_ANALYTIC_LIGHTS={0,1} -D RTR_WORK_STATISTICS={0,1} -D RTR_MAX_COMPOSITION={0,1,2}
RtrNativeDynamicLighting.hlsl -T cs -E main -o app/ProcessingPasses -D RTR_LIGHT_GROUP_CAPACITY={1,2,4,32} -D RTR_ANALYTIC_LIGHTS={0,1} -D RTR_WORK_STATISTICS=0 -D RTR_MAX_COMPOSITION=1
RtrNativeDynamicLightingReconstruct.hlsl -T cs -E main -o app/ProcessingPasses -D RTR_LIGHT_GROUP_CAPACITY={1,2,4,32} -D RTR_ANALYTIC_LIGHTS={0,1} -D RTR_WORK_STATISTICS=0 -D RTR_MAX_COMPOSITION=1
RtrNativeLightingDeep.hlsl -T cs -E main -o app/ProcessingPasses
RtrNativeLightingEncode.hlsl -T cs -E main -o app/ProcessingPasses
RtrNativeLightingResolve.hlsl -T cs -E main -o app/ProcessingPasses
RtrNativeGiReduce.hlsl -T cs -E main -o app/ProcessingPasses
RtrNativeGiUpsample.hlsl -T cs -E main -o app/ProcessingPasses
RtrAnalyticBeauty.hlsl -T cs -E main -o app/ProcessingPasses -D RTXPT_NESTED_DIELECTRICS_QUALITY={0,1,2} -D RTXPT_LP_TYPES_USE_16BIT_PRECISION={0,1}
