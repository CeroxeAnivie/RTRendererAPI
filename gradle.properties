# LWJGL uses native access as part of its supported JNI contract. The Java 24+
# sun.misc.Unsafe migration switch is applied only to matching test launchers;
# Java 21 rejects that newer VM option before the process can start.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

project_group=top.ceroxe.rt
project_version=2.0.0
# The active Gradle JVM supplies the compiler by default (Java 21 or 25); the root build still
# forces --release 21 for every published class file. -Pjava_toolchain_version remains an
# explicit opt-in when that alternate JDK is installed for compatibility testing.
