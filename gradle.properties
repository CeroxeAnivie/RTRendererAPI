# LWJGL uses native access as part of its supported JNI contract. The Java 24+
# sun.misc.Unsafe migration switch is applied only to matching test launchers;
# All supported launchers use Java 25 or newer.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true

project_group=top.ceroxe.rt
project_version=7.0.0
# Java 25 is the compiler, API and bytecode baseline for all published modules.
